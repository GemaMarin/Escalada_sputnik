name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Cada mañana y los jueves por la tarde: actualiza bloques, vías y planos de Sputnik Legazpi.
    - cron: '17 5 * * *'
    - cron: '43 15 * * 4'

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Actualizar datos de la sala (Vertical-Life)
        run: node scripts/update-gym.mjs
        continue-on-error: true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # A veces GitHub falla al publicar por un problema suyo temporal: se espera y se reintenta.
      - name: Esperar antes de reintentar
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
      # GitHub desactiva las tareas programadas tras 60 días sin cambios en el repositorio.
      # Volver a activarlo en cada ejecución mantiene la actualización diaria funcionando siempre.
      - name: Mantener activa la actualización diaria
        if: github.event_name == 'schedule'
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pages.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
